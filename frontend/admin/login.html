<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — Gracegifthub Gift Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1a3a6b 0%,#0d2444 60%,#091929 100%);
  font-family:'Segoe UI',Arial,sans-serif}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo-area{text-align:center;margin-bottom:28px}
.logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#1a3a6b,#2563eb);
  border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:12px}
.logo-icon i{color:#fff;font-size:28px}
.logo-area h1{font-size:1.35rem;font-weight:700;color:#1a3a6b}
.logo-area p{font-size:.85rem;color:#6b7280;margin-top:4px}
.form-group{margin-bottom:18px}
label{display:block;font-size:.82rem;font-weight:600;color:#374151;margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:.9rem}
input[type=email],input[type=password],input[type=text]{
  width:100%;padding:11px 12px 11px 36px;border:1.5px solid #d1d5db;border-radius:8px;
  font-size:.93rem;transition:border-color .2s,box-shadow .2s;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,#1a3a6b,#2563eb);
  color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;
  cursor:pointer;transition:opacity .2s;margin-top:4px}
.btn-login:hover{opacity:.92}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.error-msg{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;
  padding:10px 14px;font-size:.87rem;margin-bottom:16px;display:none}
.totp-section{display:none}
.back-link{text-align:center;margin-top:16px}
.back-link a{font-size:.83rem;color:#6b7280;text-decoration:none}
.back-link a:hover{color:#1a3a6b}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<script src="../js/config.js"></script>
<script src="../js/admin-fetch-patch.js"></script>
<div class="login-card">
  <div class="logo-area">
    <div class="logo-icon"><i class="fas fa-gift"></i></div>
    <h1>Gracegifthub Gift Hub</h1>
    <p>Administrator Login</p>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <!-- Step 1: credentials -->
  <div id="credForm">
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="admin@example.com" autocomplete="email">
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <i class="fas fa-sign-in-alt"></i> Sign In
    </button>
  </div>

  <!-- Step 2: 2FA -->
  <div class="totp-section" id="totpForm">
    <div class="form-group">
      <label><i class="fas fa-shield-alt"></i> Two-Factor Authentication Code</label>
      <div class="input-wrap">
        <i class="fas fa-key"></i>
        <input type="text" id="totpCode" placeholder="000000" maxlength="8" autocomplete="one-time-code">
      </div>
    </div>
    <button class="btn-login" id="totpBtn" onclick="doLoginWith2FA()">
      <i class="fas fa-check-circle"></i> Verify & Sign In
    </button>
    <div class="back-link"><a href="#" onclick="resetForm()">← Back to login</a></div>
  </div>

  <div class="back-link"><a href="/">← Back to store</a></div>
</div>

<script>
let require2fa = false;

function showError(msg){
  const el=document.getElementById('errorMsg');
  el.textContent=msg; el.style.display='block';
}
function hideError(){document.getElementById('errorMsg').style.display='none';}

function setLoading(btn, loading){
  if(loading){
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>Signing in…';
  } else {
    btn.disabled=false;
    btn.innerHTML=btn.id==='loginBtn'?
      '<i class="fas fa-sign-in-alt"></i> Sign In':
      '<i class="fas fa-check-circle"></i> Verify & Sign In';
  }
}

async function doLogin(){
  hideError();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');
  if(!email||!password){showError('Please enter your email and password.');return;}
  setLoading(btn,true);
  try{
    const r=await fetch('/admin/api/login',{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})});
    const d=await r.json();
    if(r.status===401&&d.require_2fa){
      require2fa=true;
      document.getElementById('credForm').style.display='none';
      document.getElementById('totpForm').style.display='block';
      hideError();
      return;
    }
    if(!r.ok){showError(d.error||'Login failed.');return;}
    window.location.href='/admin';
  }catch(e){showError('Network error. Please try again.');}
  finally{setLoading(btn,false);}
}

async function doLoginWith2FA(){
  hideError();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const totp_code=document.getElementById('totpCode').value.trim();
  const btn=document.getElementById('totpBtn');
  setLoading(btn,true);
  try{
    const r=await fetch('/admin/api/login',{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password,totp_code})});
    const d=await r.json();
    if(!r.ok){showError(d.error||'Invalid code.');return;}
    window.location.href='/admin';
  }catch(e){showError('Network error.');}
  finally{setLoading(btn,false);}
}

function resetForm(){
  document.getElementById('credForm').style.display='block';
  document.getElementById('totpForm').style.display='none';
  hideError();
}

// Enter key support
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.getElementById('totpForm').style.display==='block') doLoginWith2FA();
    else doLogin();
  }
});
</script>
</body>
</html>
