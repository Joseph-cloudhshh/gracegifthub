<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Gracegifthub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">🎁 Gracegifthub</a>
</header>

<section class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="muted">Log in to your dashboard</p>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Password</label>
      <input type="password" id="password" required minlength="6">
      <p id="loginError" class="form-error hidden"></p>
      <button type="submit" class="btn-primary">Log In</button>
    </form>
    <p class="muted">New here? <a href="signup.html">Create an account</a></p>
  </div>
</section>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
